version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: easy-test-redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  default:
    name: easy-test-net
    external: true

volumes:
  redis_data: