<script>
        // Simple script to toggle folder expansion for demonstration
        document.querySelectorAll('.tree-node > div').forEach(header => {
            header.addEventListener('click', (e) => {
                // Don't toggle if clicking actions
                if(e.target.closest('.tree-node-actions')) return;
                
                const chevron = header.querySelector('span:first-child');
                const childrenContainer = header.nextElementSibling;
                
                if (childrenContainer && childrenContainer.classList.contains('tree-line')) {
                    if (childrenContainer.style.display === 'none') {
                        childrenContainer.style.display = 'block';
                        chevron.classList.remove('-rotate-90');
                        header.querySelector('span:nth-child(2)').style.fontVariationSettings = "'FILL' 1";
                        header.querySelector('span:nth-child(2)').classList.add('text-primary');
                        header.querySelector('span:nth-child(2)').classList.remove('text-outline');
                    } else {
                        childrenContainer.style.display = 'none';
                        chevron.classList.add('-rotate-90');
                        header.querySelector('span:nth-child(2)').style.fontVariationSettings = "'FILL' 0";
                        header.querySelector('span:nth-child(2)').classList.remove('text-primary');
                        header.querySelector('span:nth-child(2)').classList.add('text-outline');
                    }
                }
            });
        });
    </script>
