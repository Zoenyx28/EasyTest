test_project_create_success:
  description: "创建项目成功"
  request:
    name: "测试项目"
    description: "测试项目描述"
    data_type: "image"
    visibility: "organization"
  expect:
    status_code: 200
    code: 0
    msg: "success"
    data:
      name: "测试项目"
      data_type: "image"
      status: "pending_config"
      visibility: "organization"
      cover_url: null
      id: not_none

test_project_create_name_empty:
  description: "创建项目失败-名称为空"
  request:
    name: ""
    description: "测试项目描述"
    data_type: "image"
  expect:
    status_code: 200
    code: 422
    data: null

test_project_create_name_too_long:
  description: "创建项目失败-名称超过20字符"
  request:
    name: "测试项目名称超过二十个字符"
    description: "测试项目描述"
    data_type: "image"
  expect:
    status_code: 200
    code: 422
    data: null

test_project_create_description_empty:
  description: "创建项目失败-描述为空"
  request:
    name: "测试项目"
    description: ""
    data_type: "image"
  expect:
    status_code: 200
    code: 422
    data: null

test_project_create_description_too_long:
  description: "创建项目失败-描述超过200字符"
  request:
    name: "测试项目"
    description: "a" * 201
    data_type: "image"
  expect:
    status_code: 200
    code: 422
    data: null

test_project_create_invalid_data_type:
  description: "创建项目失败-数据类型非法"
  request:
    name: "测试项目"
    description: "测试项目描述"
    data_type: "invalid_type"
  expect:
    status_code: 200
    code: 422
    data: null

