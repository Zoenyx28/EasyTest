test_task_create_success:
  description: "创建任务成功"
  request:
    name: "测试任务"
    description: "测试任务描述"
  expect:
    status_code: 200
    code: 0
    data:
      name: "测试任务"
      description: "测试任务描述"
      project_id: not_none
      id: not_none

test_task_create_name_empty:
  description: "创建任务失败-名称为空"
  request:
    name: ""
  expect:
    status_code: 200
    code: 422
    data: null

test_task_create_name_too_long:
  description: "创建任务失败-名称超过20字符"
  request:
    name: "测试任务名称超过二十个字符"
  expect:
    status_code: 200
    code: 422
    data: null

test_task_create_without_description:
  description: "创建任务-无描述"
  request:
    name: "测试任务"
  expect:
    status_code: 200
    code: 0
    data:
      name: "测试任务"
      description: null

test_task_get_list_empty:
  description: "查询任务列表-无任务"
  expect:
    status_code: 200
    code: 0
    data:
      items: []
      page: 1
      page_size: 10
      total: 0

test_task_get_detail:
  description: "查询任务详情"
  expect:
    status_code: 200
    code: 0
    data:
      id: not_none
      name: not_none
      project_id: not_none

test_task_update_name:
  description: "编辑任务-修改名称"
  request:
    name: "更新后的任务名称"
  expect:
    status_code: 200
    code: 0

test_task_update_description:
  description: "编辑任务-修改描述"
  request:
    description: "更新后的任务描述"
  expect:
    status_code: 200
    code: 0

test_task_close_success:
  description: "关闭任务成功"
  request:
    name: "测试任务"
  expect:
    status_code: 200
    code: 0

test_task_close_name_mismatch:
  description: "关闭任务失败-名称不匹配"
  request:
    name: "wrong_name"
  expect:
    status_code: 200
    code: 400

test_task_get_push_records_empty:
  description: "获取推送记录-无记录"
  expect:
    status_code: 200
    code: 0

test_task_get_task_data_items_empty:
  description: "获取任务数据列表-无数据"
  expect:
    status_code: 200
    code: 0

test_task_create_invalid_project_id:
  description: "创建任务失败-项目ID不存在"
  request:
    name: "测试任务"
  expect:
    status_code: 404

test_task_get_detail_invalid_id:
  description: "查询任务详情失败-任务ID不存在"
  expect:
    status_code: 404

test_task_update_invalid_id:
  description: "编辑任务失败-任务ID不存在"
  request:
    name: "new_name"
  expect:
    status_code: 404
