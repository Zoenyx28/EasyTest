order_page:
  order_list_table:
    by: "CSS_SELECTOR"
    value: "#order-list-table"
  create_order_button:
    by: "XPATH"
    value: "//button[contains(text(), '创建订单')]"
  product_select:
    by: "ID"
    value: "product-select"
  quantity_input:
    by: "ID"
    value: "quantity"
  address_select:
    by: "ID"
    value: "address-select"
  submit_button:
    by: "XPATH"
    value: "//button[contains(text(), '提交订单')]"
  success_message:
    by: "CSS_SELECTOR"
    value: ".success-message"
  order_number:
    by: "CSS_SELECTOR"
    value: ".order-number"
  order_row:
    by: "CSS_SELECTOR"
    value: ".order-row"
  order_status:
    by: "CSS_SELECTOR"
    value: ".order-status"
  cancel_button:
    by: "XPATH"
    value: "//button[contains(text(), '取消订单')]"
  confirm_cancel_button:
    by: "XPATH"
    value: "//button[contains(text(), '确定取消')]"
  order_id_input:
    by: "ID"
    value: "order-id-input"
  search_button:
    by: "XPATH"
    value: "//button[contains(text(), '查询')]"
  export_button:
    by: "XPATH"
    value: "//button[contains(text(), '导出')]"